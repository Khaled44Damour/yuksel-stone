{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YÜKSEL Stone - تعديل المنتج</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #07090e;
            color: #f3f4f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .form-card {
            background: linear-gradient(145deg, #111827, #1f2937);
            border: 2px solid #00d2ff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.3);
            width: 100%;
            max-width: 500px;
        }
        .form-card h2 {
            color: #00d2ff;
            margin-bottom: 25px;
            font-size: 24px;
            text-align: center;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.4);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            color: #9ca3af;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            background: #0b0f19;
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 8px;
            color: #f3f4f6;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-group textarea { resize: vertical; height: 100px; }
        .form-group input:focus, .form-group textarea:focus {
            border-color: #00d2ff;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
        }
        .current-img {
            display: block;
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid rgba(0, 210, 255, 0.3);
        }
        .btn-submit {
            width: 100%;
            background: #00d2ff;
            color: #07090e;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
            margin-top: 10px;
        }
        .btn-submit:hover {
            background: #00bce4;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.7);
        }
        .back-link {
            display: block;
            margin-top: 20px;
            color: #9ca3af;
            text-decoration: none;
            font-size: 14px;
            text-align: center;
            transition: color 0.3s;
        }
        .back-link:hover { color: #00d2ff; }
    </style>
</head>
<body>

    <div class="form-card">
        <h2>تعديل بيانات المنتج</h2>
        
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group">
                <label>اسم المنتج</label>
                <input type="text" name="name" value="{{ product.name }}" required autocomplete="off">
            </div>
            <div class="form-group">
                <label>السعر ($)</label>
                <input type="number" step="0.01" name="price" value="{{ product.price }}" required>
            </div>
            <div class="form-group">
                <label>وصف المنتج</label>
                <textarea name="description" required>{{ product.description }}</textarea>
            </div>
            <div class="form-group">
                <label>الصورة الحالية:</label>
                {% if product.image %}
                    <img src="{{ product.image.url }}" class="current-img" alt="{{ product.name }}">
                {% else %}
                    <p style="color: #9ca3af; font-size: 13px; margin-bottom: 10px;">لا توجد صورة</p>
                {% endif %}
                <label>تغيير الصورة (اختياري)</label>
                <input type="file" name="image" accept="image/*">
                <div class="form-group">
    <label>رقم القسم (1: غرانيت، 2: بورسلين، 3: ستانلس)</label>
    <select name="category" required style="width: 100%; padding: 12px; background: #0b0f19; border: 1px solid rgba(0, 210, 255, 0.3); border-radius: 8px; color: #f3f4f6; font-size: 15px; outline: none;">
        <option value="1">1 - غرانيت ورخام</option>
        <option value="2">2 - بورسلين</option>
        <option value="3">3 - أحواض ستانلس</option>
    </select>
</div>
            </div>
            <button type="submit" class="btn-submit">حفظ التعديلات</button>
        </form>

        <a href="{% url 'admin_dashboard' %}" class="back-link">← العودة إلى لوحة التحكم</a>
    </div>

</body>
</html>
