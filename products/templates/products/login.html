{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YÜKSEL Stone - تسجيل دخول الأدمن</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #07090e;
            color: #f3f4f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: linear-gradient(145deg, #111827, #1f2937);
            border: 2px solid #00d2ff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-card h2 {
            color: #00d2ff;
            margin-bottom: 25px;
            font-size: 24px;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.4);
        }
        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }
        .form-group label {
            display: block;
            color: #9ca3af;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            background: #0b0f19;
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 8px;
            color: #f3f4f6;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            border-color: #00d2ff;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
        }
        .btn-submit {
            width: 100%;
            background: #00d2ff;
            color: #07090e;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
            margin-top: 10px;
        }
        .btn-submit:hover {
            background: #00bce4;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.7);
        }
        .error-msg {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #f87171;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .back-home {
            display: block;
            margin-top: 20px;
            color: #9ca3af;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }
        .back-home:hover {
            color: #00d2ff;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>لوحة تحكم الأدمن</h2>
        
        {% if error %}
            <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>اسم المستخدم</label>
                <input type="text" name="username" required autocomplete="off">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn-submit">تسجيل الدخول</button>
        </form>

        <a href="{% url 'home' %}" class="back-home">العودة إلى الرئيسية ←</a>
    </div>

</body>
</html>
